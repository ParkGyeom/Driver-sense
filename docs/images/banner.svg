<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Driver Sense — 차 안에 나만의 선생님.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111418"/>
      <stop offset="1" stop-color="#1B2B44"/>
    </linearGradient>
    <radialGradient id="glowWarn" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC04D" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFC04D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOk" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4C8DFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4C8DFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    text { font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif; }
  </style>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="930" cy="120" r="210" fill="url(#glowWarn)"/>
  <circle cx="1120" cy="260" r="200" fill="url(#glowOk)"/>

  <!-- 왼쪽: 이름과 소개 -->
  <g transform="translate(72 0)">
    <rect x="0" y="86" width="132" height="34" rx="17" fill="#FFC04D"/>
    <text x="66" y="109" text-anchor="middle" font-size="17" font-weight="700" fill="#111418">PLEOS CONNECT</text>
    <text x="0" y="196" font-size="76" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Driver Sense</text>
    <text x="2" y="244" font-size="30" font-weight="700" fill="#FFC04D">차 안에 나만의 선생님.</text>
    <text x="2" y="286" font-size="19" fill="#C9D2DE">차량 신호로 운전 법규 습관을 진단하고, 놓치기 쉬운 순간을</text>
    <text x="2" y="314" font-size="19" fill="#C9D2DE">음성 한 문장과 작은 카드로 미리 알려주는 차량용 앱</text>
  </g>

  <!-- 오른쪽 위: 지금 켜세요 카드 (앱의 팝업 모양) -->
  <g transform="translate(760 58)" filter="url(#shadow)">
    <rect x="0" y="0" width="440" height="112" rx="20" fill="#FFFFFF" stroke="#F2A700" stroke-width="5"/>
    <circle cx="58" cy="56" r="34" fill="#FFC04D"/>
    <path d="M66 70 V48 H46" fill="none" stroke="#111418" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M52 39 L41 48 L52 57" fill="none" stroke="#111418" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="108" y="44" font-size="17" font-weight="600" fill="#5D6673">좌회전</text>
    <text x="106" y="86" font-size="40" font-weight="800" fill="#111418">60<tspan font-size="20" fill="#5D6673" dx="6">m</tspan></text>
    <rect x="222" y="32" width="196" height="48" rx="24" fill="#FFC04D"/>
    <text x="320" y="64" text-anchor="middle" font-size="22" font-weight="800" fill="#111418">! 지금 켜세요</text>
  </g>

  <!-- 오른쪽 아래: 좋아요 카드 -->
  <g transform="translate(820 196)" filter="url(#shadow)">
    <rect x="0" y="0" width="400" height="112" rx="20" fill="#FFFFFF" stroke="#2F6FE4" stroke-width="5"/>
    <circle cx="58" cy="56" r="34" fill="#4C8DFF"/>
    <path d="M66 70 V48 H46" fill="none" stroke="#111418" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M52 39 L41 48 L52 57" fill="none" stroke="#111418" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="108" y="44" font-size="17" font-weight="600" fill="#5D6673">좌회전</text>
    <text x="106" y="86" font-size="40" font-weight="800" fill="#111418">28<tspan font-size="20" fill="#5D6673" dx="6">m</tspan></text>
    <rect x="232" y="32" width="146" height="48" rx="24" fill="#4C8DFF"/>
    <text x="305" y="64" text-anchor="middle" font-size="22" font-weight="800" fill="#111418">✓ 좋아요</text>
  </g>
</svg>

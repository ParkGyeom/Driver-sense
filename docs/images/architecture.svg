<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="구조: Pleos SDK, 차량 앱 안의 판정 엔진, Spring 서버">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#151A21" flood-opacity="0.12"/>
    </filter>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#566173"/>
    </marker>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#A85400"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1F5FD1"/>
    </marker>
  </defs>
  <style>
    text { font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif; }
    .h { font-size: 22px; font-weight: 800; fill: #151A21; }
    .s { font-size: 15px; fill: #566173; }
    .b { font-size: 17px; font-weight: 700; fill: #151A21; }
    .l { font-size: 14px; font-weight: 700; fill: #566173; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 14px; fill: #566173; }
  </style>

  <rect width="1280" height="440" rx="24" fill="#EBEEF2"/>

  <!-- Pleos SDK -->
  <g transform="translate(40 70)" filter="url(#sh)">
    <rect width="220" height="300" rx="18" fill="#FFFFFF"/>
    <text x="24" y="44" class="h">Pleos SDK</text>
    <text x="24" y="68" class="s">차량 신호와 음성</text>
    <g class="b">
      <rect x="20" y="92" width="180" height="40" rx="10" fill="#EEF1F5"/>
      <text x="36" y="118" class="b">Vehicle</text>
      <rect x="20" y="140" width="180" height="40" rx="10" fill="#EEF1F5"/>
      <text x="36" y="166" class="b">NaviHelper</text>
      <rect x="20" y="188" width="180" height="40" rx="10" fill="#EEF1F5"/>
      <text x="36" y="214" class="b">FusedLocation</text>
      <rect x="20" y="236" width="180" height="40" rx="10" fill="#EEF1F5"/>
      <text x="36" y="262" class="b">TextToSpeech</text>
    </g>
  </g>

  <!-- 차량 앱 -->
  <g transform="translate(320 30)">
    <rect width="650" height="380" rx="22" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="2" filter="url(#sh)"/>
    <text x="28" y="44" class="h">app/ 차량 앱</text>
    <text x="168" y="44" class="mono">kkam.app · Android Automotive</text>

    <!-- 신호 수집 -->
    <rect x="28" y="96" width="160" height="96" rx="14" fill="#EEF1F5"/>
    <text x="108" y="138" text-anchor="middle" class="b">신호 수집</text>
    <text x="108" y="162" text-anchor="middle" class="s">1초마다 한 프레임</text>

    <!-- 판정 엔진 -->
    <rect x="232" y="80" width="190" height="128" rx="16" fill="#151A21"/>
    <text x="327" y="120" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">판정 엔진</text>
    <text x="327" y="146" text-anchor="middle" font-size="15" fill="#C9D2DE">engine/ · 순수 Kotlin</text>
    <text x="327" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#FFC04D">R1~R7 상태 머신</text>

    <!-- GUIDE 쪽 -->
    <rect x="468" y="62" width="158" height="112" rx="14" fill="#FDF1DE" stroke="#F2A700" stroke-width="2"/>
    <text x="547" y="98" text-anchor="middle" class="b">음성 안내</text>
    <text x="547" y="124" text-anchor="middle" class="s">Pleos TTS로 읽기</text>
    <text x="547" y="148" text-anchor="middle" class="s">코치 카드 · 팝업</text>

    <!-- EVENT 쪽 -->
    <rect x="468" y="210" width="158" height="96" rx="14" fill="#E7EFFC" stroke="#2F6FE4" stroke-width="2"/>
    <text x="547" y="248" text-anchor="middle" class="b">리포트</text>
    <text x="547" y="274" text-anchor="middle" class="s">법규 Q&amp;A · 기록</text>

    <!-- 법규 룰 테이블 -->
    <g transform="translate(232 262)">
      <ellipse cx="95" cy="12" rx="95" ry="12" fill="#EEF1F5" stroke="#D5DBE3" stroke-width="2"/>
      <path d="M0 12 V68 A95 12 0 0 0 190 68 V12" fill="#EEF1F5" stroke="#D5DBE3" stroke-width="2"/>
      <ellipse cx="95" cy="12" rx="95" ry="12" fill="#F7F9FB" stroke="#D5DBE3" stroke-width="2"/>
      <text x="95" y="50" text-anchor="middle" class="b">법규 룰 테이블</text>
      <text x="95" y="72" text-anchor="middle" class="mono">data/law_table.json</text>
    </g>

    <!-- 앱 안 화살표 -->
    <line x1="190" y1="144" x2="228" y2="144" stroke="#566173" stroke-width="3" marker-end="url(#a)"/>
    <path d="M424 120 C444 120 446 118 464 118" fill="none" stroke="#A85400" stroke-width="3" marker-end="url(#aw)"/>
    <text x="424" y="106" class="l" style="fill:#A85400">GUIDE</text>
    <path d="M424 176 C446 176 446 258 464 258" fill="none" stroke="#1F5FD1" stroke-width="3" marker-end="url(#ab)"/>
    <text x="398" y="236" class="l" style="fill:#1F5FD1">EVENT</text>
    <path d="M424 304 C446 304 446 290 464 290" fill="none" stroke="#566173" stroke-width="2.5" marker-end="url(#a)"/>
  </g>

  <!-- SDK → 앱 -->
  <line x1="262" y1="174" x2="344" y2="174" stroke="#566173" stroke-width="3" marker-end="url(#a)"/>
  <text x="270" y="160" class="l">신호</text>
  <!-- 서버 -->
  <g transform="translate(1020 150)">
    <rect width="220" height="150" rx="18" fill="#FFFFFF" stroke="#566173" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="24" y="44" class="h">server/</text>
    <text x="24" y="72" class="b">Spring 서버</text>
    <text x="24" y="100" class="s">판정 이벤트 저장,</text>
    <text x="24" y="122" class="s">리포트 API (연결 전)</text>
  </g>
  <line x1="948" y1="288" x2="1014" y2="250" stroke="#566173" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a)"/>
  <text x="972" y="300" class="l">계획</text>
</svg>
